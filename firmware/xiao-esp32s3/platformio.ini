; ------------------------------------------------
; BRAIN 2: XIAO ESP32-S3 (AI & Media Core)
; ------------------------------------------------
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO ESP32-S3 has 8MB OPI PSRAM. The player does not need it (tracks are
; pre-decoded raw PCM streamed straight off the card) but it is left enabled
; so the Sense camera/mic can be added later without changing the memory map.
board_build.arduino.memory_type = qio_opi
build_flags =
	-Wl,--allow-multiple-definition
	-DBOARD_HAS_PSRAM
	; 0, not 1: a slot with no card makes SD.begin() fail once a second, and at
	; level 1 the driver logs an error every time. This is a handheld player -
	; the console has to stay readable.
	-DCORE_DEBUG_LEVEL=0
	; Required by Edge Impulse on ESP32 - their own esp32 examples set it and
	; the SDK defaults it to 1 (dsp/config.hpp). At 1 the MFE filterbank is
	; computed in quantized int8 and the features come out degenerate: the DSP
	; and the network both run and report timings, and every class comes back
	; 0.00. It has to be a build flag, not a #define in main.cpp - the library's
	; own .cpp files are separate translation units and would never see it.
	-DEIDSP_QUANTIZE_FILTERBANK=0

; No audio decoder library any more: all decoding happens on the PC.
; SD, SPI and FS ship with the Arduino ESP32 core.

; The impulse lives at lib/epod_inferencing, which PlatformIO scans by default.
; Exactly one copy may exist anywhere the build can see: two copies compile
; silently and the wrong model wins.
