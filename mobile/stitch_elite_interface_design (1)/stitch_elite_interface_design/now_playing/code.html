<style>
        /* Base rPETG Texture */
        body {
            background-color: #f8f9fa;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        /* Hardware Accent Line */
        .hardware-accent {
            background: linear-gradient(90deg, transparent, #B87333, transparent);
            background-size: 200% 100%;
            animation: pulse-copper 3s infinite linear;
        }

        @keyframes pulse-copper {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 8px;
            border-radius: 2px;
            background: #2ECC71;
            cursor: pointer;
            margin-top: -10px;
            border: 1px solid #191c1d;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e1e3e4;
            border-radius: 2px;
            border: 1px solid #d9dadb;
        }
        
        .fill-track {
             position: absolute;
             height: 4px;
             background: #2ECC71;
             background-image: radial-gradient(circle, rgba(0,0,0,0.1) 1px, transparent 1px);
             background-size: 4px 4px;
             border-radius: 2px;
             pointer-events: none;
             top: 50%;
             transform: translateY(-50%);
             z-index: 0;
        }
        
        .slider-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .slider-container input {
            position: relative;
            z-index: 1;
        }
    </style>

<script>
        // Simple script to update the custom slider fill
        const sliders = document.querySelectorAll('input[type="range"]');
        sliders.forEach(slider => {
            slider.addEventListener('input', (e) => {
                const container = e.target.parentElement;
                const fill = container.querySelector('.fill-track');
                if(fill) {
                    fill.style.width = e.target.value + '%';
                }
            });
        });
    </script>
