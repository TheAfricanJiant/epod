<style>
          body {
              -webkit-tap-highlight-color: transparent;
          }
          /* Custom range slider styling for a premium feel */
          input[type=range] {
              -webkit-appearance: none;
              width: 100%;
              background: transparent;
          }
          input[type=range]::-webkit-slider-thumb {
              -webkit-appearance: none;
              height: 16px;
              width: 16px;
              border-radius: 50%;
              background: #c3e2ba; /* primary */
              cursor: pointer;
              margin-top: -6px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
              box-shadow: 0 0 10px rgba(195, 226, 186, 0.5);
          }
          input[type=range]::-webkit-slider-runnable-track {
              width: 100%;
              height: 4px;
              cursor: pointer;
              background: #333537; /* surface-variant */
              border-radius: 2px;
          }
          input[type=range]:focus {
              outline: none;
          }
          
          /* Visualizer bars animation */
          @keyframes bounce {
              0%, 100% { height: 10%; opacity: 0.5; }
              50% { height: 100%; opacity: 1; }
          }
          .bar {
              animation: bounce 1.2s ease-in-out infinite;
              background: linear-gradient(to top, #4a6545, #c3e2ba);
          }
          .bar:nth-child(1) { animation-delay: 0.1s; }
          .bar:nth-child(2) { animation-delay: 0.3s; }
          .bar:nth-child(3) { animation-delay: 0.0s; }
          .bar:nth-child(4) { animation-delay: 0.5s; }
          .bar:nth-child(5) { animation-delay: 0.2s; }
          .bar:nth-child(6) { animation-delay: 0.6s; }
          .bar:nth-child(7) { animation-delay: 0.1s; }
          .bar:nth-child(8) { animation-delay: 0.4s; }
      </style>
