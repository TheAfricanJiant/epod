<style>
        /* Base Surface */
        body {
            background-color: #f8f9fa;
        }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 8px;
            border-radius: 2px;
            background: #006d37;
            cursor: pointer;
            margin-top: -10px;
            border: 1px solid #191c1d;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e1e3e4;
            border-radius: 2px;
            border: 1px solid #d9dadb;
        }
        
        .fill-track {
             position: absolute;
             height: 4px;
             background: #006d37;
             border-radius: 2px;
             pointer-events: none;
             top: 50%;
             transform: translateY(-50%);
             z-index: 0;
        }
        
        .slider-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .slider-container input {
            position: relative;
            z-index: 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<script>
        // Simple script to update the custom slider fill
        const sliders = document.querySelectorAll('input[type="range"]');
        sliders.forEach(slider => {
            slider.addEventListener('input', (e) => {
                const container = e.target.parentElement;
                const fill = container.querySelector('.fill-track');
                if(fill) {
                    fill.style.width = e.target.value + '%';
                }
            });
        });
    </script>
